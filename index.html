<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NewXen (নিউজেন) – Women's Fashion</title>
<style>
  html { scroll-behavior: smooth; }
  body { background: #f8fafc; color: #0f172a; font-family: 'Inter', 'Hind Siliguri', system-ui, sans-serif; margin: 0; }
  .overflow-x-auto { scrollbar-width: none; }
  .overflow-x-auto::-webkit-scrollbar { display: none; }

  /* ===== NewXen 3D soft-UI (neumorphic) sign-in / sign-up kit: white surface, rose accents ===== */
  .wallet-card{position:relative;border-radius:1.25rem;padding:1.5rem;color:#0f172a;overflow:hidden;background:#fff;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.wallet-chip{width:2.4rem;height:1.8rem;border-radius:.45rem;background:#fbbf24;opacity:.9}
.acct-hero{background:#fff;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.acct-tile{background:#fff;border:1px solid #e2e8f0;border-radius:1.25rem;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.acct-nav-on{background:#4c0519;color:#fff}
.neo-card { position: relative; background: linear-gradient(145deg, #ffffff, #f3f5f9); border-radius: 30px; padding: 32px 28px 28px;
    box-shadow: 18px 18px 40px rgba(100,116,139,.22), -14px -14px 34px rgba(255,255,255,.98), inset 1px 1px 0 rgba(255,255,255,1), inset -1px -1px 0 rgba(100,116,139,.06); }
  .neo-badge { width: 68px; height: 68px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: #4c0519;
    background: linear-gradient(145deg, #ffffff, #f1f4f8);
    box-shadow: 8px 8px 16px rgba(100,116,139,.22), -6px -6px 14px rgba(255,255,255,1); }
  .neo-input { width: 100%; box-sizing: border-box; background: #eef1f6; border: 0; border-radius: 20px; padding: 15px 20px; color: #1e293b; font-size: 14px; outline: none;
    box-shadow: inset 6px 6px 12px rgba(100,116,139,.22), inset -6px -6px 12px rgba(255,255,255,1); transition: box-shadow .2s ease; }
  .neo-input::placeholder { color: #94a3b8; font-weight: 500; }
  .neo-input:focus { box-shadow: inset 4px 4px 9px rgba(100,116,139,.26), inset -4px -4px 9px rgba(255,255,255,1), 0 0 0 2px rgba(225,29,72,.28), 0 0 18px rgba(251,191,36,.28); }
  .neo-input:-webkit-autofill { -webkit-box-shadow: inset 0 0 0 40px #eef1f6; }
  .neo-btn { width: 100%; border: 0; cursor: pointer; border-radius: 20px; padding: 15px 18px; color: #4c0519; font-weight: 800; font-size: 14px; letter-spacing: .2px;
    background: linear-gradient(145deg, #ffffff, #f1f4f8);
    box-shadow: 7px 7px 15px rgba(100,116,139,.24), -6px -6px 13px rgba(255,255,255,1); transition: transform .09s ease, box-shadow .09s ease, filter .15s ease; }
  .neo-btn:hover:not(:disabled) { color: #be123c; }
  .neo-btn:active:not(:disabled) { transform: translateY(2px); color: #fff; background: #4c0519; box-shadow: inset 3px 3px 8px rgba(0,0,0,.35); }
  .neo-btn:disabled { opacity: .5; cursor: not-allowed; filter: grayscale(.35); }
  .neo-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: 22px; background: #eef1f6;
    box-shadow: inset 5px 5px 10px rgba(100,116,139,.2), inset -5px -5px 10px rgba(255,255,255,1); }
  .neo-tab { border: 0; cursor: pointer; border-radius: 17px; padding: 10px 6px; font-weight: 700; font-size: 12px; color: #64748b; background: transparent; transition: all .15s ease; }
  .neo-tab.on { color: #9f1239; background: linear-gradient(145deg, #ffffff, #f4f6fa); box-shadow: 5px 5px 10px rgba(100,116,139,.22), -4px -4px 9px rgba(255,255,255,1); }
  .neo-eye { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; border-radius: 50%; cursor: pointer; color: #64748b; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, #fff, #eef1f6); box-shadow: 3px 3px 6px rgba(100,116,139,.22), -3px -3px 6px rgba(255,255,255,1); }
  .neo-well { border-radius: 20px; padding: 14px 16px; background: #eef1f6; box-shadow: inset 5px 5px 10px rgba(100,116,139,.18), inset -5px -5px 10px rgba(255,255,255,1); }
  .neo-check { width: 24px; height: 24px; flex: none; border: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; background: #eef1f6;
    box-shadow: inset 3px 3px 6px rgba(100,116,139,.25), inset -3px -3px 6px rgba(255,255,255,1); transition: all .15s ease; }
  .neo-check.on { background: linear-gradient(145deg, #34d399, #059669); box-shadow: 0 4px 0 #047857, 0 8px 14px rgba(5,150,105,.28), inset 0 1px 0 rgba(255,255,255,.4); transform: translateY(-1px); }
  .neo-link { color: #be123c; font-weight: 800; font-size: 12px; background: none; border: 0; cursor: pointer; }
  .neo-link:hover { text-decoration: underline; }
  .neo-msg { border-radius: 16px; padding: 10px 14px; font-size: 11px; color: #475569; background: #eef1f6; box-shadow: inset 3px 3px 6px rgba(100,116,139,.16), inset -3px -3px 6px rgba(255,255,255,1); }
</style>
