anges follow the Return Policy shown on this website.","Your phone and address stay private (only you and the NewXen admin can see them). The shop publicly shows your store name, logo, city and short bio."],bn:["পণ্য লাইভ হওয়ার আগে আপনার সেলার অ্যাকাউন্টে অ্যাডমিনের অনুমোদন লাগবে। নিয়ম ভাঙলে অ্যাডমিন পণ্য হাইড বা অ্যাকাউন্ট সাসপেন্ড করতে পারবে।","শুধু আসল ও বিক্রির অনুমতি আছে এমন পণ্য বিক্রি করুন। নকল, কপি বা নিষিদ্ধ পণ্য চলবে না।","ছবি, ভিডিও ও বিবরণ আপনার নিজের (বা অনুমতিপ্রাপ্ত) এবং আসল পণ্যের সাথে মিল থাকতে হবে। দাম, সাইজ, রং, স্টক ও ইউনিট (পিস / গজ) সঠিক দিতে হবে।","স্টক হালনাগাদ রাখুন, অর্ডার দ্রুত কনফার্ম করুন এবং কথামতো ডেলিভারি দিন।","অর্ডারে থাকা কাস্টমারের নাম, ফোন ও ঠিকানা শুধু সেই অর্ডার ডেলিভারির জন্য। অন্য কাজে ব্যবহার, শেয়ার বা বিক্রি করা যাবে না।","রিটার্ন ও এক্সচেঞ্জ এই ওয়েবসাইটের রিটার্ন পলিসি অনুযায়ী হবে।","আপনার ফোন ও ঠিকানা গোপন থাকে (শুধু আপনি ও NewXen অ্যাডমিন দেখতে পান)। সাইটে শুধু স্টোরের নাম, লোগো, শহর ও ছোট পরিচিতি দেখা যায়।"]},S4=t=>String(t||"").split(`
